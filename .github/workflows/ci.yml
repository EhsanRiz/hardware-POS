name: CI

# The suite runs against a production build served locally, with every Supabase
# call intercepted (e2e/fake-backend.ts). No credentials, no connectivity and no
# shared database — which is what lets it gate a pull request rather than run
# nightly against a staging shop.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch makes the first run irrelevant; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browser suite drives the till against a hand-written fake of the server,
  # which is a second implementation of the same rules — and a second
  # implementation agrees with the first right up until it doesn't. This job
  # applies every migration to a real Postgres and calls the RPCs as written, so
  # a migration that will not apply fails here instead of at a deploy.
  database:
    name: Migrations and database rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # The client only — the server is the service container above.
      - name: Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations and database rules
        run: npm run test:db

  test:
    name: Types, unit rules and the till end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # VAT, cash rounding, thin-space formatting and phone matching. These are
      # the rules a shop would be out of pocket over, and they run in a second.
      - name: Unit rules
        run: npm test

      # Keyed on the lockfile: the browser build Playwright wants is pinned by
      # the @playwright/test version in it, so a dependency bump misses the
      # cache and re-downloads, which is exactly the behaviour wanted.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds with .env.e2e (deliberately fake values, committed), serves it on
      # 4173 and drives it. See playwright.config.ts.
      - name: End to end
        run: npm run test:e2e

      # Traces, screenshots and video are retained on failure by the config, and
      # a trace of the actual run beats re-reading the test.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # The till in the shop, updated.
  #
  # Deploying was a person running two commands on the one machine that had
  # both a .env and a Cloudflare login. That meant every fix sat finished and
  # unshipped until somebody was at that machine — and on the day the slip
  # stopped printing, the fix existed for hours before it reached the counter.
  #
  # NEEDS BOTH TEST JOBS. A till a shop sells on must never take a build whose
  # migrations would not apply or whose suite is red; "deploy on green" is the
  # whole point of putting this behind them rather than beside them.
  #
  # Only on a push to main. A pull request builds and tests; it does not ship.
  # ------------------------------------------------------------------------
  deploy:
    name: Deploy the till
    needs: [database, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, and never cancel a half-finished upload.
    concurrency:
      group: deploy-app
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The only value the bundle cannot do without. Everything else in
      # .env.example now has a fallback in the code, or comes from the server:
      # the shop's name, address and VAT number are settings, not build flags.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || {
            echo "::error::VITE_SUPABASE_ANON_KEY is not set. The bundle would"
            echo "::error::build and then fail on load at the counter."
            exit 1
          }
          npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler.toml names the worker (hardware-pos) and attaches
          # app.innovaearth.com itself, so there is no dashboard step.
          command: deploy
