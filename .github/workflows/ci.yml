name: CI

# The suite runs against a production build served locally, with every Supabase
# call intercepted (e2e/fake-backend.ts). No credentials, no connectivity and no
# shared database — which is what lets it gate a pull request rather than run
# nightly against a staging shop.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch makes the first run irrelevant; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browser suite drives the till against a hand-written fake of the server,
  # which is a second implementation of the same rules — and a second
  # implementation agrees with the first right up until it doesn't. This job
  # applies every migration to a real Postgres and calls the RPCs as written, so
  # a migration that will not apply fails here instead of at a deploy.
  database:
    name: Migrations and database rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # The client only — the server is the service container above.
      - name: Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations and database rules
        run: npm run test:db

  test:
    name: Types, unit rules and the till end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # VAT, cash rounding, thin-space formatting and phone matching. These are
      # the rules a shop would be out of pocket over, and they run in a second.
      - name: Unit rules
        run: npm test

      # Keyed on the lockfile: the browser build Playwright wants is pinned by
      # the @playwright/test version in it, so a dependency bump misses the
      # cache and re-downloads, which is exactly the behaviour wanted.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds with .env.e2e (deliberately fake values, committed), serves it on
      # 4173 and drives it. See playwright.config.ts.
      - name: End to end
        run: npm run test:e2e

      # Traces, screenshots and video are retained on failure by the config, and
      # a trace of the actual run beats re-reading the test.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
